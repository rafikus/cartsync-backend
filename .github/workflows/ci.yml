name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Test SSH Connection
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p 2255 github-actions@kusy.net "echo 'SSH connection successful'"

      - name: Deploy to VPS
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p 2255 github-actions@kusy.net << 'EOF'
            source ~/.bashrc
            source ~/.profile
            cd /home/github-actions/cartsync-backend
            git pull origin master
            docker compose down && docker compose up -d --build -f docker-compose.yml
          EOF
